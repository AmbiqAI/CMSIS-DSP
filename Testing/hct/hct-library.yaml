# The CMSIS-DSP pack for helia-core-tester (hct).
schema: hct/library-profile/1
library: cmsis-dsp
source_root: ../..
contracts:
  signatures: kernel_contracts.json
harness:
  includes: [arm_math.h]
  header_includes: [arm_math.h]
  # arm_status in Include/arm_math_types.h; test_profile.py holds the two together.
  status:
    type: arm_status
    success: ARM_MATH_SUCCESS
    argument_error: ARM_MATH_ARGUMENT_ERROR
    codes:
      ARM_MATH_SUCCESS: 0
      ARM_MATH_ARGUMENT_ERROR: -1
      ARM_MATH_LENGTH_ERROR: -2
      ARM_MATH_SIZE_MISMATCH: -3
      ARM_MATH_NANINF: -4
      ARM_MATH_SINGULAR: -5
      ARM_MATH_TEST_FAILURE: -6
      ARM_MATH_DECOMPOSITION_FAILURE: -7
host_reference:
  project: Testing/hct/host_reference
  option: CMSISDSP_HOST_REFERENCE
  manifest: cmsis_dsp_host_reference.json
  build_inputs: [Include, PrivateInclude, Source, Testing/hct/host_reference]
pack:
  api: "1.0"
  descriptors: descriptors
  modules: [basic_math]
# The FVP tests link CMSISDSP from Source/ through the root CMakeLists.txt. Helium on cortex-m55; float16
# is left out where GCC has no MVE to lower it with (cortex-m55-dsp is the M55 with MVE turned off).
build:
  target: CMSISDSP
  definitions:
    CMSISCORE: "{cmsis_path}/CMSIS/Core"
  cpu_definitions:
    cortex-m55: {HELIUM: "ON", MVEFLOAT16: "ON"}
    cortex-m55-dsp: {DISABLEFLOAT16: "ON"}
    cortex-m4: {DISABLEFLOAT16: "ON"}
    cortex-m0: {DISABLEFLOAT16: "ON"}
