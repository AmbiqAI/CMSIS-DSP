name: Ambiq tests

# Every pull request to ambiq/integration, with no path filter: the host variants run every suite in
# Testing/cmake/ci_suites.txt, the target variants run those the changed files map to, and the coverage
# gate judges the lines the pull request changed against the merged report of all of them.
#
# A full run (nightly, a tag, a manual run, or a pull request labelled ci-full) runs every listed suite on
# all nine variants, both instrumented at -O0 and at the shipped flags, and gates the whole merged report.
# A schedule here would never fire, since GitHub schedules only the default branch (main): heliaDSP's
# cmsis-dsp-nightly workflow starts the nightly run through workflow_dispatch on ambiq/integration.
on:
  pull_request:
    branches: [ambiq/integration]
    types: [opened, synchronize, reopened, labeled]
  push:
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ambiq-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolchain, CMSIS_6 and Cortex_DFP the target variants were verified with.
  ARM_GCC_URL: https://artifacts.tools.arm.com/arm-none-eabi-gcc/14.3.1/arm-gnu-toolchain-x86_64-arm-none-eabi.tar.xz
  CMSIS_6_REF: 8753b993c7544f0329b2ccc61bfbc967fdb3b112
  CORTEX_DFP_REF: v1.2.0
  BASE_REF: ${{ github.base_ref || 'ambiq/integration' }}
  FULL: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci-full') }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      host_suites: ${{ steps.plan.outputs.host_suites }}
      target_suites: ${{ steps.plan.outputs.target_suites }}
      builds: ${{ steps.plan.outputs.builds }}
      full: ${{ env.FULL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Choose the suites
        id: plan
        run: |
          if [ "$FULL" = true ]; then
            scope=(--full)
            echo 'builds=["coverage", "shipped"]' >> "$GITHUB_OUTPUT"
          else
            scope=(--diff-base "origin/$BASE_REF")
            echo 'builds=["coverage"]' >> "$GITHUB_OUTPUT"
          fi
          python Testing/coverage/ci_plan.py --root . "${scope[@]}" --output "$GITHUB_OUTPUT"

  host:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [A, B, C, I]
        build: ${{ fromJSON(needs.plan.outputs.builds) }}
    name: host ${{ matrix.variant }} ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Testing/requirements-ci.txt
      - name: Install the Python packages
        run: pip install -r Testing/requirements-ci.txt
      - name: Import every pattern generator dependency
        run: |
          python -c "import statsmodels.api, statsmodels.tsa.stattools, sklearn, pyquaternion, matplotlib.pyplot
          from scipy.interpolate import interp2d"
      # GCC 14, as on the targets: gcovr cannot merge GCC 13's reports, which lack function positions, with them.
      - name: Install Ninja and GCC 14
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-14 g++-14
      - name: Configure
        run: >
          cmake -G Ninja -S Testing/cmake -B build -DPython3_EXECUTABLE="$(which python)"
          -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14
          -DCMSISDSP_TEST_VARIANT=${{ matrix.variant }}
          -DCMSISDSP_TEST_COVERAGE=${{ matrix.build == 'coverage' && 'ON' || 'OFF' }}
          "-DCMSISDSP_TEST_SUITES=${{ needs.plan.outputs.host_suites }}"
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: matrix.build == 'coverage'
        with:
          name: coverage-${{ matrix.variant }}
          path: build/coverage/coverage-${{ matrix.variant }}.json
          if-no-files-found: error

  target:
    needs: plan
    if: needs.plan.outputs.target_suites != ''
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [D, E, F, G, H]
        build: ${{ fromJSON(needs.plan.outputs.builds) }}
    name: target ${{ matrix.variant }} ${{ matrix.build }}
    env:
      ON_QEMU: ${{ contains(fromJSON('["D", "E"]'), matrix.variant) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ARM-software/CMSIS_6
          ref: ${{ env.CMSIS_6_REF }}
          path: ci-deps/CMSIS_6
      - uses: actions/checkout@v4
        with:
          repository: ARM-software/Cortex_DFP
          ref: ${{ env.CORTEX_DFP_REF }}
          path: ci-deps/Cortex_DFP
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Testing/requirements-ci.txt
      - name: Install the Python packages
        run: pip install -r Testing/requirements-ci.txt
      - name: Install the Arm GNU toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/arm-gcc"
          curl -sSfL "$ARM_GCC_URL" | tar -xJ -C "$RUNNER_TEMP/arm-gcc" --strip-components=1
          echo "ARM_GCC_ROOT=$RUNNER_TEMP/arm-gcc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/arm-gcc/bin/arm-none-eabi-gcc" --version | head -1
      - name: Install Ninja and QEMU
        run: |
          packages=(ninja-build)
          if [ "$ON_QEMU" = true ]; then packages+=(qemu-system-arm); fi
          sudo apt-get update
          sudo apt-get install -y "${packages[@]}"
      - name: Install the Corstone-300 FVP
        if: env.ON_QEMU != 'true'
        uses: ARM-software/cmsis-actions/vcpkg@v1
        with:
          config: ./Testing/cmake/vcpkg-configuration.json
          cache: -ambiq-tests
      - name: Configure
        run: |
          model=()
          if [ "$ON_QEMU" != true ]; then
            fvp="$AVH_FVP_PLUGINS/../bin/FVP_Corstone_SSE-300_Ethos-U55"
            test -x "$fvp" || { echo "no Corstone-300 FVP at $fvp"; exit 1; }
            model=("-DCORSTONE300_FVP=$fvp")
          fi
          cmake -G Ninja -S Testing/cmake -B build -DPython3_EXECUTABLE="$(which python)" \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/Testing/cmake/toolchains/arm-none-eabi-gcc.cmake" \
            -DCMSISDSP_TEST_VARIANT=${{ matrix.variant }} \
            -DCMSISDSP_TEST_COVERAGE=${{ matrix.build == 'coverage' && 'ON' || 'OFF' }} \
            "-DCMSISDSP_TEST_SUITES=${{ needs.plan.outputs.target_suites }}" \
            -DCMSIS_CORE="$PWD/ci-deps/CMSIS_6/CMSIS/Core" -DCORTEX_DFP="$PWD/ci-deps/Cortex_DFP" "${model[@]}"
      - name: Build
        run: cmake --build build -j "$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure -j "$(nproc)"
      - uses: actions/upload-artifact@v4
        if: matrix.build == 'coverage'
        with:
          name: coverage-${{ matrix.variant }}
          path: build/coverage/coverage-${{ matrix.variant }}.json
          if-no-files-found: error

  gate:
    needs: [plan, host, target]
    # The target variants are skipped when no change maps to a suite; any other result fails the gate. A
    # full run gates and publishes whatever reports it has, and fails below unless all nine are there.
    if: >
      always() && needs.plan.result == 'success' && (needs.plan.outputs.full == 'true' || (needs.host.result == 'success' &&
      (needs.target.result == 'success' || needs.target.result == 'skipped')))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Testing/requirements-ci.txt
      - name: Install the Python packages
        run: pip install -r Testing/requirements-ci.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: reports
          merge-multiple: true
      - name: Merge the variants' reports
        run: python Testing/coverage/merge.py --root . --output-dir merged reports/coverage-*.json
      - name: Gate the changed lines
        if: env.FULL != 'true'
        run: python Testing/coverage/coverage_gate.py check --report merged/coverage.json --root . --diff-base "origin/$BASE_REF"
      - name: Gate the whole report
        if: env.FULL == 'true'
        run: python Testing/coverage/coverage_gate.py check --report merged/coverage.json --root .
      - name: Check that every variant reported
        if: always() && env.FULL == 'true'
        run: |
          missing=()
          for variant in A B C D E F G H I; do
            test -f "reports/coverage-$variant.json" || missing+=("$variant")
          done
          if [ ${#missing[@]} -gt 0 ]; then echo "no coverage report from variant(s) ${missing[*]}"; exit 1; fi
      # The gate ran whatever the matrix did; it still fails when any build, coverage or shipped, failed.
      - name: Check that every build passed
        if: always() && env.FULL == 'true'
        env:
          HOST_RESULT: ${{ needs.host.result }}
          TARGET_RESULT: ${{ needs.target.result }}
        run: |
          if [ "$HOST_RESULT" != success ] || [ "$TARGET_RESULT" != success ]; then
            echo "host builds: $HOST_RESULT, target builds: $TARGET_RESULT"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-merged
          path: merged
          if-no-files-found: ignore
