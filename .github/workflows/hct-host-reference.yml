name: hct host reference

# The plain C host build of CMSIS-DSP that helia-core-tester records goldens from (Testing/hct/host_reference):
# it builds, refuses every configuration that would change it, gives exact results to a caller built from its
# manifest alone, and helia-core-tester reads that manifest.
on:
  pull_request:
    branches: [ambiq/integration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hct-host-reference-${{ github.ref }}
  cancel-in-progress: true

env:
  # The helia-core-tester commit that reads the manifest (feat/la-e6-build-backend, E6;
  # moves to the dev/kernel-contracts-dsp merge once E5 and E6 land).
  HCT_REF: 9ba806b06ae2ee3c389213299ec90db6be4ca1d4

jobs:
  host-reference:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc-14
          # No macOS runners are available to this repository; macOS clang is checked locally.
          - os: ubuntu-24.04
            cc: clang-18
    runs-on: ${{ matrix.os }}
    name: host reference (${{ matrix.os }}, ${{ matrix.cc }})
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AmbiqAI/helia-core-tester
          ref: ${{ env.HCT_REF }}
          path: .hct
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install Ninja and the compiler
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.cc }}
      - name: Test the host reference
        env:
          HCT_ROOT: ${{ github.workspace }}/.hct
          HCT_REQUIRED: '1'
        run: python -m unittest discover -s Testing/hct/host_reference -p "test_*.py" -v
      # Runs every generator and checks each CaseSpec against the contract; goldens come from this host build.
      - name: Generate every pack case
        working-directory: .hct
        run: >-
          uv run --frozen -p 3.12 helia_core_tester generate --library "$GITHUB_WORKSPACE/Testing/hct"
          --golden record --cpu cortex-m55 --suite both --seed 7
